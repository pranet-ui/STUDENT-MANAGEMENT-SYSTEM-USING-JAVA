spring.application.name=edupilot
server.port=${PORT:8080}
spring.datasource.url=jdbc:mysql://${MYSQLHOST}:${MYSQLPORT}/${MYSQLDATABASE}
spring.datasource.username=${MYSQLUSER}
spring.datasource.password=${MYSQLPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://student-management-system-using-java-topaz.vercel.app}
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:admin@edupilot.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
