spring.application.name=edupilot
server.port=8080
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edupilot?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
app.jwt.secret=${JWT_SECRET:local-development-secret-change-this-32-bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.admin.email=${ADMIN_EMAIL:admin@edupilot.local}
app.admin.password=${ADMIN_PASSWORD:ChangeMe123!}
